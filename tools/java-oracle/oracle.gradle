import org.gradle.api.tasks.SourceSetContainer

// Register before project evaluation so Gradle 9 can discover the injected
// task while it is selecting the command line task graph.
gradle.beforeProject { project ->
    if (project.path != ':core') {
        return
    }

    project.pluginManager.withPlugin('java-library') {
        def sourceDir = gradle.startParameter.projectProperties['oracleSourceDir']
        def seed = gradle.startParameter.projectProperties['oracleSeed']
        def depth = gradle.startParameter.projectProperties['oracleDepth']
        def finalHeapsDepth = gradle.startParameter.projectProperties['oracleFinalHeapsDepth']
        def generatorDeckRollover =
                gradle.startParameter.projectProperties['oracleGeneratorDeckRollover']
        def generatorLifecycle =
                gradle.startParameter.projectProperties['oracleGeneratorLifecycle']
		def impRingDeck =
				gradle.startParameter.projectProperties['oracleImpRingDeck']
		def questNpcPlacement =
				gradle.startParameter.projectProperties['oracleQuestNpcPlacement']
        def shopBagSelection =
                gradle.startParameter.projectProperties['oracleShopBagSelection']
		def sacrificeReward =
				gradle.startParameter.projectProperties['oracleSacrificeReward']
		def secretLibraryOrder =
				gradle.startParameter.projectProperties['oracleSecretLibraryOrder']
		def figureEightTrace =
				gradle.startParameter.projectProperties['oracleFigureEightTrace']
		def freeSpaceTrace =
				gradle.startParameter.projectProperties['oracleFreeSpaceTrace']
		def cavesBossPatch =
				gradle.startParameter.projectProperties['oracleCavesBossPatch']
		def hallsPaintTrace =
				gradle.startParameter.projectProperties['oracleHallsPaintTrace']
        if (sourceDir == null || seed == null) {
            throw new GradleException('javaOracleDump requires oracleSourceDir and oracleSeed')
        }

        def sourceSets = project.extensions.getByType(SourceSetContainer)
        def main = sourceSets.named('main').get()
        def oracle = sourceSets.create('javaOracle') {
            java.srcDir(sourceDir)
            compileClasspath = main.output + main.compileClasspath
            runtimeClasspath = output + main.runtimeClasspath +
                    project.configurations[runtimeClasspathConfigurationName]
        }
        project.dependencies.add(
                oracle.runtimeOnlyConfigurationName,
                "com.badlogicgames.gdx:gdx-platform:${project.rootProject.ext.gdxVersion}:natives-desktop")

        project.tasks.named(oracle.compileJavaTaskName) {
            dependsOn(project.tasks.named(main.classesTaskName))
            options.release = 11
        }
        project.tasks.register('javaOracleDump', JavaExec) {
            group = 'verification'
            description = 'Dumps pinned SPD identity and level-generation facts as stable JSON.'
            dependsOn(project.tasks.named(oracle.classesTaskName))
            classpath = oracle.runtimeClasspath
            mainClass = 'com.shatteredpixel.shatteredpixeldungeon.tools.JavaOracle'
            args(seed)
            if (depth != null) {
                args(depth)
            }
            if (finalHeapsDepth != null) {
                args('final-heaps', finalHeapsDepth)
            }
            if (generatorDeckRollover != null) {
                args('generator-deck-rollover')
            }
            if (generatorLifecycle != null) {
                args('generator-lifecycle')
            }
			if (impRingDeck != null) {
				args('imp-ring-deck')
			}
			if (questNpcPlacement != null) {
				args('quest-npc-placement')
			}
            if (shopBagSelection != null) {
                args('shop-bag-selection')
            }
			if (sacrificeReward != null) {
				args('sacrifice-reward')
			}
			if (secretLibraryOrder != null) {
				args('secret-library-order')
			}
			if (figureEightTrace != null) {
				args('figure-eight-trace', figureEightTrace)
			}
			if (freeSpaceTrace != null) {
				args('free-space-trace', freeSpaceTrace)
			}
			if (cavesBossPatch != null) {
				args('caves-boss-patch')
			}
			if (hallsPaintTrace != null) {
				args('halls-paint-trace', hallsPaintTrace)
			}
        }
    }
}
