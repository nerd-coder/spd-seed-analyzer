[workspace]
resolver = "2"
members = [
    "crates/spd-objects",
    "crates/spd-core",
    "crates/spd-wasm",
    "crates/spd-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/NerdCoder/spd-seed-analyzer"

# `bun run profile`: release codegen plus line tables for samplers.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

[workspace.dependencies]
spd-core = { path = "crates/spd-core" }
spd-objects = { path = "crates/spd-objects" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
js-sys = "0.3"
